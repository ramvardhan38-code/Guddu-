<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guddu - Personal Life</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #eef3ff;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #dce7ff;
    }

    .card {
      margin-top: 20px;
      padding: 18px;
      background: #f8f9fc;
      border-radius: 15px;
      line-height: 1.6;
    }

    .back {
      margin-top: 20px;
      background: #222;
      color: white;
      width: 100%;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🏠 Guddu Personal Life</h1>

  <p class="subtitle">
    Your personal life assistant
  </p>

  <div class="buttons">

    <button onclick="showTasks()">
      📋 Tasks
    </button>

    <button onclick="showReminders()">
      ⏰ Reminders
    </button>

    <button onclick="showFamily()">
      👨‍👩‍👦 Family
    </button>

    <button onclick="showHome()">
      🏡 Home
    </button>

    <button onclick="showFitness()">
      🏃 Fitness
    </button>

    <button onclick="showDates()">
      📅 Important Dates
    </button>

    <button onclick="showShopping()">
      🛒 Shopping
    </button>

    <button onclick="showNotes()">
      📝 Personal Notes
    </button>

  </div>

  <div id="content" class="card">
    👋 Welcome to your personal Guddu.
    <br><br>
    Select an option above.
  </div>

  <button class="back" onclick="goHome()">
    🤖 Back to Guddu
  </button>

</div>


<script>

function show(text) {
  document.getElementById("content").innerHTML = text;
}


function showTasks() {

  show(`
    <h2>📋 Personal Tasks</h2>

    <p>Use this area for things you need to complete.</p>

    <p>• Bills</p>
    <p>• Appointments</p>
    <p>• Purchases</p>
    <p>• Personal work</p>
    <p>• Family activities</p>
  `);

}


function showReminders() {

  show(`
    <h2>⏰ Reminders</h2>

    <p>Important reminders can be managed here.</p>

    <p>• Bill payments</p>
    <p>• Renewals</p>
    <p>• Appointments</p>
    <p>• Birthdays</p>
    <p>• Anniversaries</p>
  `);

}


function showFamily() {

  show(`
    <h2>👨‍👩‍👦 Family</h2>

    <p>Family-related planning and information.</p>

    <p>• Family activities</p>
    <p>• School activities</p>
    <p>• Family purchases</p>
    <p>• Important events</p>
  `);

}


function showHome() {

  show(`
    <h2>🏡 Home</h2>

    <p>Manage your home-related activities.</p>

    <p>• Electricity</p>
    <p>• DTH</p>
    <p>• Internet</p>
    <p>• Mobile bills</p>
    <p>• Maintenance</p>
    <p>• Shopping</p>
  `);

}


function showFitness() {

  show(`
    <h2>🏃 Fitness</h2>

    <p>Personal fitness planning.</p>

    <p>• Workout tracking</p>
    <p>• Walking</p>
    <p>• Home workouts</p>
    <p>• Weight tracking</p>
    <p>• Fitness goals</p>
  `);

}


function showDates() {

  show(`
    <h2>📅 Important Dates</h2>

    <p>Keep important dates in one place.</p>

    <p>• Birthdays</p>
    <p>• Anniversaries</p>
    <p>• Renewals</p>
    <p>• Appointments</p>
    <p>• Family events</p>
  `);

}


function showShopping() {

  show(`
    <h2>🛒 Shopping</h2>

    <p>Shopping planning and decisions.</p>

    <p>• Grocery</p>
    <p>• Electronics</p>
    <p>• Home items</p>
    <p>• Family purchases</p>
    <p>• Compare before buying</p>
  `);

}


function showNotes() {

  show(`
    <h2>📝 Personal Notes</h2>

    <p>Store ideas, plans and things you want Guddu to remember.</p>
  `);

}


function goHome() {

  window.location.href = "index.html";

}

</script>

</body>
</html>
