<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guddu AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #eef3ff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #dce7ff;
    }

    #message {
      margin-top: 25px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 12px;
      min-height: 30px;
    }

    .chat-box {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .chat-box input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .send-button {
      background: #222;
      color: white;
      padding: 14px 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 Guddu</h1>

    <p class="subtitle">
      Your Personal AI Assistant
    </p>

    <div class="buttons">

      <button onclick="showMessage('📋 Tasks & Reminders')">
        📋 Tasks
      </button>

      <button onclick="showMessage('💰 Finance & Investments')">
        💰 Finance
      </button>

      <button onclick="showMessage('💼 Work & Procurement')">
        💼 Work
      </button>

      <button onclick="showMessage('📄 Documents')">
        📄 Documents
      </button>

      <button onclick="showMessage('🔎 Research Assistant')">
        🔎 Research
      </button>

      <button onclick="showMessage('🎙️ Voice Assistant coming soon')">
        🎙️ Voice
      </button>

    </div>

    <div id="message">
      👋 Hello! I am Guddu. Choose an option above.
    </div>

    <div class="chat-box">

      <input
        type="text"
        id="userInput"
        placeholder="Ask Guddu anything..."
      >

      <button class="send-button" onclick="askGuddu()">
        Send
      </button>

    </div>

  </div>

  <script>

    function showMessage(text) {
      document.getElementById("message").innerText = text;
    }

    function askGuddu() {

      const input = document.getElementById("userInput");
      const message = document.getElementById("message");

      const question = input.value.trim();

      if (question === "") {
        message.innerText =
          "🤖 Guddu: Please type something first.";
        return;
      }

      message.innerText =
        '🤖 Guddu: I received your message — "' +
        question +
        '"';

      input.value = "";
    }

  </script>

</body>
</html>
