<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guddu AI</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #eef3ff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #dce7ff;
    }

    #message {
      margin-top: 25px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 12px;
      min-height: 30px;
      line-height: 1.5;
    }

    .chat-box {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .chat-box input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .send-button {
      background: #222;
      color: white;
      padding: 14px 18px;
    }

    .send-button:hover {
      background: #444;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>🤖 Guddu</h1>

    <p class="subtitle">
      Your Personal AI Assistant
    </p>


    <div class="buttons">

      <button onclick="showMessage('📋 Tasks & Reminders')">
        📋 Tasks
      </button>

      <button onclick="showMessage('💰 Finance & Investments')">
        💰 Finance
      </button>

      <button onclick="showMessage('💼 Work & Procurement')">
        💼 Work
      </button>

      <button onclick="showMessage('📄 Documents')">
        📄 Documents
      </button>

      <button onclick="showMessage('🔎 Research Assistant')">
        🔎 Research
      </button>

      <button onclick="showMessage('🎙️ Voice Assistant coming soon')">
        🎙️ Voice
      </button>

    </div>


    <div id="message">
      👋 Hello! I am Guddu. Choose an option above or type a message below.
    </div>


    <div class="chat-box">

      <input
        type="text"
        id="userInput"
        placeholder="Ask Guddu anything..."
        onkeydown="handleEnter(event)"
      >

      <button
        class="send-button"
        onclick="askGuddu()"
      >
        Send
      </button>

    </div>

  </div>


  <script>

    function showMessage(text) {

      document.getElementById("message").innerText = text;

    }


    function handleEnter(event) {

      if (event.key === "Enter") {

        askGuddu();

      }

    }


    function askGuddu() {

      const input =
        document.getElementById("userInput");

      const message =
        document.getElementById("message");

      const question =
        input.value.trim();


      if (question === "") {

        message.innerText =
          "🤖 Guddu: Please type something first.";

        return;

      }


      const q =
        question.toLowerCase();


      if (
        q.includes("hello") ||
        q.includes("hi") ||
        q.includes("hey")
      ) {

        message.innerText =
          "🤖 Guddu: Hello! 👋 I am Guddu. How can I help you today?";

      }


      else if (
        q.includes("what can you do") ||
        q.includes("help")
      ) {

        message.innerText =
          "🤖 Guddu can help with Tasks 📋, Finance 💰, Work 💼, Documents 📄, Research 🔎 and Voice 🎙️.";

      }


      else if (
        q.includes("task") ||
        q.includes("reminder")
      ) {

        message.innerText =
          "🤖 Guddu: Tasks & Reminders 📋 are ready. Tell me what task you want to add.";

      }


      else if (
        q.includes("finance") ||
        q.includes("investment") ||
        q.includes("money")
      ) {

        message.innerText =
          "🤖 Guddu: Finance mode 💰 is ready. I can help organize your financial information.";

      }


      else if (
        q.includes("work") ||
        q.includes("procurement") ||
        q.includes("supplier") ||
        q.includes("purchase")
      ) {

        message.innerText =
          "🤖 Guddu: Work & Procurement mode 💼 is ready. Tell me what you need.";

      }


      else if (
        q.includes("document") ||
        q.includes("contract")
      ) {

        message.innerText =
          "🤖 Guddu: Documents mode 📄 is ready. I can help you organize documents and contracts.";

      }


      else if (
        q.includes("research") ||
        q.includes("search")
      ) {

        message.innerText =
          "🤖 Guddu: Research mode 🔎 is ready. Tell me what you want to research.";

      }


      else {

        message.innerText =
          "🤖 Guddu: I received your message — \"" +
          question +
          "\". My advanced AI brain is coming next! 🧠";

      }


      input.value = "";

    }

  </script>

</body>
</html>
