<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guddu AI</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #eef3ff;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #dce7ff;
    }

    .primary {
      background: #222;
      color: white;
    }

    .section {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fc;
      border-radius: 15px;
    }

    .section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .chat-box {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .chat-box input {
      margin: 0;
    }

    #message {
      margin-top: 20px;
      padding: 14px;
      background: #f1f3f6;
      border-radius: 12px;
      line-height: 1.5;
    }

    .card {
      background: white;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.06);
    }

    .delete {
      background: #ffe5e5;
      padding: 8px;
      font-size: 12px;
    }

    .result {
      margin-top: 12px;
      padding: 12px;
      background: white;
      border-radius: 10px;
      line-height: 1.6;
    }

    .work-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .work-buttons button {
      font-size: 14px;
      padding: 12px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>🤖 Guddu</h1>

  <p class="subtitle">
    Your Personal AI Assistant
  </p>


  <!-- MAIN BUTTONS -->

  <div class="buttons">

    <button onclick="openTasks()">
      📋 Tasks
    </button>

    <button onclick="openFinance()">
      💰 Finance
    </button>

    <button onclick="openWork()">
      💼 Work
    </button>

    <button onclick="showMessage('📄 Documents module coming next.')">
      📄 Documents
    </button>

    <button onclick="showMessage('🔎 Research module coming next.')">
      🔎 Research
    </button>

    <button onclick="showMessage('🎙️ Voice Assistant coming next.')">
      🎙️ Voice
    </button>

  </div>


  <!-- MESSAGE -->

  <div id="message">
    👋 Hello! I am Guddu. Choose an option or ask me something.
  </div>


  <!-- CHAT -->

  <div class="chat-box">

    <input
      type="text"
      id="userInput"
      placeholder="Ask Guddu anything..."
      onkeydown="handleEnter(event)"
    >

    <button
      class="primary"
      onclick="askGuddu()"
    >
      Send
    </button>

  </div>


  <!-- TASKS -->

  <div
    id="taskSection"
    class="section"
    style="display:none;"
  >

    <h2>📋 My Tasks</h2>

    <input
      type="text"
      id="taskInput"
      placeholder="Enter a task..."
      onkeydown="handleTaskEnter(event)"
    >

    <button onclick="addTask()">
      ➕ Add Task
    </button>

    <div id="taskList"></div>

  </div>


  <!-- FINANCE -->

  <div
    id="financeSection"
    class="section"
    style="display:none;"
  >

    <h2>💰 Finance Dashboard</h2>

    <h3>📊 My Mutual Funds</h3>

    <input
      type="text"
      id="fundName"
      placeholder="Fund name"
    >

    <input
      type="number"
      id="fundAmount"
      placeholder="Monthly SIP ₹"
    >

    <button onclick="addFund()">
      ➕ Add Fund
    </button>

    <div id="fundList"></div>

    <div class="result">

      <strong>Total Monthly SIP:</strong>

      <div id="totalSip">
        ₹0
      </div>

    </div>


    <h3>🧮 SIP Calculator</h3>

    <input
      type="number"
      id="sipAmount"
      placeholder="Monthly SIP ₹"
    >

    <input
      type="number"
      id="sipReturn"
      placeholder="Expected annual return %"
    >

    <input
      type="number"
      id="sipYears"
      placeholder="Investment period (years)"
    >

    <button onclick="calculateSIP()">
      Calculate
    </button>

    <div id="sipResult" class="result"></div>


    <h3>📉 Market Dip Planner</h3>

    <input
      type="number"
      id="dipAmount"
      placeholder="Extra investment amount ₹"
    >

    <button onclick="calculateDip()">
      Create Dip Plan
    </button>

    <div id="dipResult" class="result"></div>


    <h3>📝 Investment Notes</h3>

    <input
      type="text"
      id="investmentNote"
      placeholder="Investment note"
    >

    <button onclick="saveNote()">
      Save Note
    </button>

    <div id="notesList" class="result"></div>

  </div>


  <!-- WORK -->

  <div
    id="workSection"
    class="section"
    style="display:none;"
  >

    <h2>💼 Work & Procurement</h2>

    <div class="work-buttons">

      <button onclick="showRFQ()">
        📋 RFQ
      </button>

      <button onclick="showRFP()">
        📑 RFP
      </button>

      <button onclick="showRFI()">
        🔎 RFI
      </button>

      <button onclick="showSupplier()">
        🤝 Supplier
      </button>

      <button onclick="showContract()">
        📄 Contract
      </button>

      <button onclick="showSavings()">
        💰 Savings
      </button>

      <button onclick="showEmail()">
        ✉️ Email
      </button>

      <button onclick="showChecklist()">
        ✅ Checklist
      </button>

    </div>


    <div id="workContent" class="result">

      Select a Work & Procurement option above.

    </div>

  </div>

</div>


<script>


/* =========================
   GENERAL
========================= */

function showMessage(text) {

  document.getElementById("message").innerText = text;

}


function handleEnter(event) {

  if (event.key === "Enter") {

    askGuddu();

  }

}


/* =========================
   CHAT
========================= */

function askGuddu() {

  const input =
    document.getElementById("userInput");

  const question =
    input.value.trim();

  if (question === "") {

    showMessage(
      "🤖 Guddu: Please type something first."
    );

    return;

  }

  const q =
    question.toLowerCase();


  if (
    q.includes("hello") ||
    q.includes("hi") ||
    q.includes("hey")
  ) {

    showMessage(
      "🤖 Guddu: Hello! 👋 How can I help you?"
    );

  }

  else if (
    q.includes("finance") ||
    q.includes("investment") ||
    q.includes("sip")
  ) {

    openFinance();

  }

  else if (
    q.includes("task") ||
    q.includes("reminder")
  ) {

    openTasks();

  }

  else if (
    q.includes("rfq") ||
    q.includes("rfp") ||
    q.includes("rfi") ||
    q.includes("procurement") ||
    q.includes("supplier") ||
    q.includes("contract")
  ) {

    openWork();

  }

  else if (
    q.includes("what can you do") ||
    q.includes("help")
  ) {

    showMessage(
      "🤖 Guddu can currently help with Tasks 📋, Finance 💰 and Work & Procurement 💼."
    );

  }

  else {

    showMessage(
      '🤖 Guddu received: "' +
      question +
      '"'
    );

  }

  input.value = "";

}


/* =========================
   TASKS
========================= */

let tasks =
  JSON.parse(
    localStorage.getItem("gudduTasks")
  ) || [];


function openTasks() {

  document.getElementById(
    "taskSection"
  ).style.display = "block";

  document.getElementById(
    "financeSection"
  ).style.display = "none";

  document.getElementById(
    "workSection"
  ).style.display = "none";

  showMessage(
    "🤖 Guddu: Your Tasks are ready. 📋"
  );

  displayTasks();

}


function addTask() {

  const input =
    document.getElementById("taskInput");

  const task =
    input.value.trim();

  if (task === "") {

    showMessage(
      "🤖 Guddu: Enter a task first."
    );

    return;

  }

  tasks.push(task);

  localStorage.setItem(
    "gudduTasks",
    JSON.stringify(tasks)
  );

  input.value = "";

  displayTasks();

  showMessage(
    "🤖 Guddu: Task added successfully! ✅"
  );

}


function displayTasks() {

  const list =
    document.getElementById("taskList");

  list.innerHTML = "";

  if (tasks.length === 0) {

    list.innerHTML =
      "<p>No tasks yet.</p>";

    return;

  }

  tasks.forEach(
    function(task, index) {

      const item =
        document.createElement("div");

      item.className =
        "card";

      item.innerHTML =
        "<span>" +
        (index + 1) +
        ". " +
        task +
        "</span>" +

        "<br><br>" +

        "<button class='delete' onclick='deleteTask(" +
        index +
        ")'>Delete</button>";

      list.appendChild(item);

    }
  );

}


function deleteTask(index) {

  tasks.splice(index, 1);

  localStorage.setItem(
    "gudduTasks",
    JSON.stringify(tasks)
  );

  displayTasks();

}


function handleTaskEnter(event) {

  if (event.key === "Enter") {

    addTask();

  }

}


/* =========================
   FINANCE
========================= */

let funds =
  JSON.parse(
    localStorage.getItem("gudduFunds")
  ) || [];


function openFinance() {

  document.getElementById(
    "financeSection"
  ).style.display = "block";

  document.getElementById(
    "taskSection"
  ).style.display = "none";

  document.getElementById(
    "workSection"
  ).style.display = "none";

  showMessage(
    "🤖 Guddu: Finance Dashboard is ready. 💰"
  );

  displayFunds();

  displayNotes();

}


function addFund() {

  const name =
    document.getElementById(
      "fundName"
    ).value.trim();

  const amount =
    Number(
      document.getElementById(
        "fundAmount"
      ).value
    );


  if (
    name === "" ||
    amount <= 0
  ) {

    showMessage(
      "🤖 Guddu: Enter a fund name and SIP amount."
    );

    return;

  }


  funds.push({

    name: name,

    amount: amount

  });


  localStorage.setItem(
    "gudduFunds",
    JSON.stringify(funds)
  );


  document.getElementById(
    "fundName"
  ).value = "";

  document.getElementById(
    "fundAmount"
  ).value = "";


  displayFunds();

}


function displayFunds() {

  const list =
    document.getElementById(
      "fundList"
    );

  list.innerHTML = "";

  let total = 0;


  funds.forEach(
    function(fund, index) {

      total += fund.amount;


      const item =
        document.createElement("div");

      item.className =
        "card";


      item.innerHTML =
        "<strong>" +
        fund.name +
        "</strong>" +

        "<br>₹" +
        fund.amount.toLocaleString("en-IN") +
        " / month" +

        "<br><br>" +

        "<button class='delete' onclick='deleteFund(" +
        index +
        ")'>Delete</button>";


      list.appendChild(item);

    }
  );


  document.getElementById(
    "totalSip"
  ).innerText =
    "₹" +
    total.toLocaleString("en-IN");

}


function deleteFund(index) {

  funds.splice(index, 1);

  localStorage.setItem(
    "gudduFunds",
    JSON.stringify(funds)
  );

  displayFunds();

}


/* =========================
   SIP CALCULATOR
========================= */

function calculateSIP() {

  const P =
    Number(
      document.getElementById(
        "sipAmount"
      ).value
    );

  const annualRate =
    Number(
      document.getElementById(
        "sipReturn"
      ).value
    );

  const years =
    Number(
      document.getElementById(
        "sipYears"
      ).value
    );


  if (
    P <= 0 ||
    annualRate <= 0 ||
    years <= 0
  ) {

    document.getElementById(
      "sipResult"
    ).innerText =
      "Please enter valid values.";

    return;

  }


  const months =
    years * 12;

  const monthlyRate =
    annualRate / 12 / 100;


  const futureValue =
    P *
    (
      (
        Math.pow(
          1 + monthlyRate,
          months
        ) - 1
      ) /
      monthlyRate
    ) *
    (1 + monthlyRate);


  const invested =
    P * months;


  const profit =
    futureValue - invested;


  document.getElementById(
    "sipResult"
  ).innerHTML =

    "<strong>Estimated Corpus:</strong> ₹" +
    Math.round(
      futureValue
    ).toLocaleString("en-IN") +

    "<br><strong>Total Invested:</strong> ₹" +
    invested.toLocaleString("en-IN") +

    "<br><strong>Estimated Gain:</strong> ₹" +
    Math.round(
      profit
    ).toLocaleString("en-IN");

}


/* =========================
   DIP PLANNER
========================= */

function calculateDip() {

  const amount =
    Number(
      document.getElementById(
        "dipAmount"
      ).value
    );


  if (amount <= 0) {

    return;

  }


  const p5 =
    amount * 0.10;

  const p10 =
    amount * 0.20;

  const p15 =
    amount * 0.25;

  const p20 =
    amount * 0.25;

  const p30 =
    amount * 0.20;


  document.getElementById(
    "dipResult"
  ).innerHTML =

    "<strong>Suggested Dip Plan</strong>" +

    "<br>-5% → ₹" +
    Math.round(p5).toLocaleString("en-IN") +

    "<br>-10% → ₹" +
    Math.round(p10).toLocaleString("en-IN") +

    "<br>-15% → ₹" +
    Math.round(p15).toLocaleString("en-IN") +

    "<br>-20% → ₹" +
    Math.round(p20).toLocaleString("en-IN") +

    "<br>-30% → ₹" +
    Math.round(p30).toLocaleString("en-IN");

}


/* =========================
   NOTES
========================= */

let notes =
  JSON.parse(
    localStorage.getItem("gudduNotes")
  ) || [];


function saveNote() {

  const input =
    document.getElementById(
      "investmentNote"
    );

  const note =
    input.value.trim();


  if (note === "") {

    return;

  }


  notes.push(note);

  localStorage.setItem(
    "gudduNotes",
    JSON.stringify(notes)
  );

  input.value = "";

  displayNotes();

}


function displayNotes() {

  const list =
    document.getElementById(
      "notesList"
    );

  if (notes.length === 0) {

    list.innerHTML =
      "No investment notes yet.";

    return;

  }


  list.innerHTML =
    notes.map(
      function(note, index) {

        return (
          (index + 1) +
          ". " +
          note
        );

      }
    ).join("<br>");

}


/* =========================
   WORK
========================= */

function openWork() {

  document.getElementById(
    "workSection"
  ).style.display = "block";

  document.getElementById(
    "taskSection"
  ).style.display = "none";

  document.getElementById(
    "financeSection"
  ).style.display = "none";

  showMessage(
    "🤖 Guddu: Work & Procurement mode is ready. 💼"
  );

}

    <p>Use an RFI when you need market information before launching an RFQ or RFP.</p>

    <p><strong>Guddu checklist:</strong></p>

  ).innerHTML = `

/* SAVINGS */

function showSavings() {

  document.getElementById(
    "workContent"
  ).innerHTML = `

    <h3>💰 Savings Calculator</h3>

    <input
      type="number"
      id="oldPrice"
      placeholder="Original / baseline price ₹"
    >

    <input
      type="number"
      id="newPrice"
      placeholder="Negotiated price ₹"
    >

    <button onclick="calculateSavings()">
      Calculate Savings
    </button>

    <div id="savingsResult" class="result"></div>

  `;

}


function calculateSavings() {

  const oldPrice =
    Number(
      document.getElementById(
        "oldPrice"
      ).value
    );

  const newPrice =
    Number(
      document.getElementById(
        "newPrice"
      ).value
    );


  if (
    oldPrice <= 0 ||
    newPrice < 0
  ) {

    return;

  }


  const savings =
    oldPrice - newPrice;

  const percentage =
    (savings / oldPrice) * 100;


  document.getElementById(
    "savingsResult"
  ).innerHTML =

    "<strong>Savings:</strong> ₹" +
    savings.toLocaleString("en-IN") +

    "<br><strong>Savings %:</strong> " +
    percentage.toFixed(2) +
    "%";

}


/* EMAIL */

function showEmail() {

  document.getElementById(
    "workContent"
  ).innerHTML = `

    <h3>✉️ Supplier Email Draft</h3>

    <input
      type="text"
      id="supplierName"
      placeholder="Supplier name"
    >

    <input
      type="text"
      id="emailTopic"
      placeholder="Subject / topic"
    >

    <button onclick="generateEmail()">
      Generate Draft
    </button>

    <div id="emailResult" class="result"></div>

  `;

}


function generateEmail() {

  const supplier =
    document.getElementById(
      "supplierName"
    ).value.trim();

  const topic =
    document.getElementById(
      "emailTopic"
    ).value.trim();


  document.getElementById(
    "emailResult"
  ).innerHTML =

    "<strong>Subject:</strong> " +
    topic +

    "<br><br>" +

    "Dear " +
    (supplier || "Supplier") +
    ",<br><br>" +

    "We are reaching out regarding " +
    (topic || "the current requirement") +
    ". Please review the details and share your response at your earliest convenience." +

    "<br><br>" +

    "Please let us know if you need any clarification." +

    "<br><br>" +

    "Regards,<br>" +
    "Procurement Team";

}

function showChecklist() {

  ).innerHTML = `

    <h3>✅ Procurement Checklist</h3>

    <p>☐ Requirement confirmed</p>
    <p>☐ Budget confirmed</p>
