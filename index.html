<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guddu AI</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #eef3ff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #dce7ff;
    }

    #message {
      margin-top: 25px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 12px;
      min-height: 30px;
      line-height: 1.5;
    }

    .chat-box {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .chat-box input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .send-button {
      background: #222;
      color: white;
      padding: 14px 18px;
    }

    .task-section {
      margin-top: 20px;
      padding: 15px;
      background: #f9fafc;
      border-radius: 15px;
    }

    .task-input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .task-item {
      background: white;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 5px rgba(0,0,0,0.06);
    }

    .delete-button {
      background: #ffe5e5;
      padding: 8px 10px;
      font-size: 13px;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>🤖 Guddu</h1>

    <p class="subtitle">
      Your Personal AI Assistant
    </p>


    <div class="buttons">

      <button onclick="openTasks()">
        📋 Tasks
      </button>

      <button onclick="showMessage('💰 Finance & Investments')">
        💰 Finance
      </button>

      <button onclick="showMessage('💼 Work & Procurement')">
        💼 Work
      </button>

      <button onclick="showMessage('📄 Documents')">
        📄 Documents
      </button>

      <button onclick="showMessage('🔎 Research Assistant')">
        🔎 Research
      </button>

      <button onclick="showMessage('🎙️ Voice Assistant coming soon')">
        🎙️ Voice
      </button>

    </div>


    <div id="message">
      👋 Hello! I am Guddu. Choose an option above or type a message below.
    </div>


    <div class="chat-box">

      <input
        type="text"
        id="userInput"
        placeholder="Ask Guddu anything..."
        onkeydown="handleEnter(event)"
      >

      <button
        class="send-button"
        onclick="askGuddu()"
      >
        Send
      </button>

    </div>


    <div id="taskSection" class="task-section" style="display:none;">

      <h3>📋 My Tasks</h3>

      <input
        type="text"
        id="taskInput"
        class="task-input"
        placeholder="Enter a task..."
        onkeydown="handleTaskEnter(event)"
      >

      <button onclick="addTask()">
        ➕ Add Task
      </button>

      <div id="taskList"></div>

    </div>

  </div>


  <script>

    let tasks =
      JSON.parse(localStorage.getItem("gudduTasks")) || [];


    function showMessage(text) {

      document.getElementById("message").innerText = text;

    }


    function openTasks() {

      const section =
        document.getElementById("taskSection");

      section.style.display = "block";

      showMessage(
        "🤖 Guddu: Your Tasks & Reminders are ready. 📋"
      );

      displayTasks();

    }


    function addTask() {

      const input =
        document.getElementById("taskInput");

      const task =
        input.value.trim();


      if (task === "") {

        showMessage(
          "🤖 Guddu: Please enter a task."
        );

        return;

      }


      tasks.push({
        text: task,
        completed: false
      });


      saveTasks();

      input.value = "";

      displayTasks();

      showMessage(
        "🤖 Guddu: Task added successfully! ✅"
      );

    }


    function displayTasks() {

      const list =
        document.getElementById("taskList");

      list.innerHTML = "";


      if (tasks.length === 0) {

        list.innerHTML =
          "<p>No tasks yet. Add your first task! 😊</p>";

        return;

      }


      tasks.forEach(function(task, index) {

        const item =
          document.createElement("div");

        item.className = "task-item";


        const text =
          document.createElement("span");

        text.innerText =
          (index + 1) + ". " + task.text;


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-button";

        deleteButton.innerText =
          "Delete";

        deleteButton.onclick =
          function() {

            deleteTask(index);

          };


        item.appendChild(text);

        item.appendChild(deleteButton);

        list.appendChild(item);

      });

    }


    function deleteTask(index) {

      tasks.splice(index, 1);

      saveTasks();

      displayTasks();

      showMessage(
        "🤖 Guddu: Task deleted. 🗑️"
      );

    }


    function saveTasks() {

      localStorage.setItem(
        "gudduTasks",
        JSON.stringify(tasks)
      );

    }


    function handleTaskEnter(event) {

      if (event.key === "Enter") {

        addTask();

      }

    }


    function handleEnter(event) {

      if (event.key === "Enter") {

        askGuddu();

      }

    }


    function askGuddu() {

      const input =
        document.getElementById("userInput");

      const message =
        document.getElementById("message");

      const question =
        input.value.trim();


      if (question === "") {

        message.innerText =
          "🤖 Guddu: Please type something first.";

        return;

      }


      const q =
        question.toLowerCase();


      if (
        q.includes("hello") ||
        q.includes("hi") ||
        q.includes("hey")
      ) {

        message.innerText =
          "🤖 Guddu: Hello! 👋 How can I help you today?";

      }


      else if (
        q.includes("what can you do") ||
        q.includes("help")
      ) {

        message.innerText =
          "🤖 Guddu can help with Tasks 📋, Finance 💰, Work 💼, Documents 📄, Research 🔎 and Voice 🎙️.";

      }


      else if (
        q.includes("task") ||
        q.includes("reminder")
      ) {

        openTasks();

      }


      else if (
        q.includes("finance") ||
        q.includes("investment") ||
        q.includes("money")
      ) {

        message.innerText =
          "🤖 Guddu: Finance mode 💰 is ready.";

      }


      else if (
        q.includes("work") ||
        q.includes("procurement") ||
        q.includes("supplier") ||
        q.includes("purchase")
      ) {

        message.innerText =
          "🤖 Guddu: Work & Procurement mode 💼 is ready.";

      }


      else if (
        q.includes("document") ||
        q.includes("contract")
      ) {

        message.innerText =
          "🤖 Guddu: Documents mode 📄 is ready.";

      }


      else if (
        q.includes("research") ||
        q.includes("search")
      ) {

        message.innerText =
          "🤖 Guddu: Research mode 🔎 is ready.";

      }


      else {

        message.innerText =
          '🤖 Guddu: I received your message — "' +
          question +
          '"';

      }


      input.value = "";

    }

  </script>

</body>
</html>
