<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guddu AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #eef3ff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #dce7ff;
    }

    #message {
      margin-top: 25px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 12px;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 Guddu</h1>

    <p class="subtitle">
      Your Personal AI Assistant
    </p>

    <div class="buttons">

      <button onclick="showMessage('📋 Tasks & Reminders')">
        📋 Tasks
      </button>

      <button onclick="showMessage('💰 Finance & Investments')">
        💰 Finance
      </button>

      <button onclick="showMessage('💼 Work & Procurement')">
        💼 Work
      </button>

      <button onclick="showMessage('📄 Documents')">
        📄 Documents
      </button>

      <button onclick="showMessage('🔎 Research Assistant')">
        🔎 Research
      </button>

      <button onclick="showMessage('🎙️ Voice Assistant coming soon')">
        🎙️ Voice
      </button>

    </div>

    <div id="message">
      👋 Hello! I am Guddu. Choose an option above.
    </div>

  </div>

  <script>
    function showMessage(text) {
      document.getElementById("message").innerText = text;
    }
  </script>

</body>
</html>
